<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viewings SG">
<title>Apartment Viewings SG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F0E8;min-height:100vh;padding-bottom:80px}
:root{--gold:#C9A84C;--cream:#F5F0E8;--dark:#1A1A1A;--border:#DDD8CE;--muted:#6B6560;--card:#FDFAF5;--green:#3A7C59;--red:#9B3A3A}
.hdr{text-align:center;padding:16px 16px 12px;border-bottom:1px solid var(--border);background:var(--cream);position:sticky;top:0;z-index:10}
.hdr .eye{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.hdr h1{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--dark);margin-bottom:2px}
.hdr .sub{font-size:11px;color:var(--muted)}
#status{text-align:center;font-size:12px;font-weight:600;padding:4px;min-height:20px;background:var(--cream)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--cream);border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;white-space:nowrap;font-size:11px;font-weight:600;background:var(--card);color:var(--muted);-webkit-appearance:none}
.tab.active{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.content{padding:0 16px}
.info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.info-time{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
.cover-photo{width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:10px;cursor:pointer}
.cover-placeholder{width:100%;height:80px;background:var(--cream);border:2px dashed var(--border);border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:10px}
.il{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.iv{font-size:14px;font-weight:700;font-family:Georgia,serif;color:var(--dark);cursor:pointer}
.iv.gold{color:var(--gold)}.iv.sm{font-size:11px}
.iv-edit{font-size:13px;font-weight:600;color:var(--dark);background:var(--cream);border:1px solid var(--gold);border-radius:6px;padding:4px 8px;outline:none;width:100%;font-family:-apple-system,sans-serif}
.pg-row{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.pg-row span{font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase}
.pg-row input{flex:1;font-size:12px;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
.apt-summary-row{padding-top:10px;border-top:1px solid var(--border);margin-top:4px}
.apt-summary-row .il{margin-bottom:4px}
.apt-summary-input{width:100%;font-size:13px;font-weight:500;color:var(--dark);background:transparent;border:none;border-bottom:1px solid var(--border);padding:4px 0;outline:none;font-family:-apple-system,sans-serif}
.apt-summary-input:focus{border-bottom-color:var(--gold)}
.cat{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.cat-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.cat-hdr.closed{border-bottom:none}
.cat-body{padding:0 16px;display:none}
.cat-body.open{display:block}
.crit{padding:12px 0;border-bottom:1px solid var(--border)}
.crit:last-child{border-bottom:none}
.crit-lbl{font-size:13px;font-weight:600;color:var(--dark);margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.must{background:#FFE5E5;color:var(--red)}.imp{background:#E8D5A3;color:#A07820}
.stars{display:flex;gap:8px;margin-bottom:8px}
.star{font-size:30px;cursor:pointer;color:var(--border);user-select:none;line-height:1}
.star.on{color:var(--gold)}
textarea{width:100%;font-size:13px;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:7px 10px;resize:vertical;outline:none;min-height:40px;font-family:-apple-system,sans-serif;-webkit-appearance:none;box-sizing:border-box}
.togs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tog{padding:8px 16px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:600;background:var(--cream);color:var(--muted);-webkit-appearance:none}
.tog.on{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.num-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.num-row input{width:100px;font-size:16px;font-weight:700;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:7px 10px;outline:none;-webkit-appearance:none}
.num-unit{font-size:12px;color:var(--muted)}
.calc{padding:10px 14px;background:#E8D5A3;border:1px solid var(--gold);border-radius:8px;margin-bottom:8px;font-size:15px;font-weight:700;color:var(--dark);font-family:Georgia,serif}
.dark-box{background:var(--dark);border-radius:12px;padding:18px;margin-top:10px;color:#F5F0E8}
.dark-box h3{font-family:Georgia,serif;font-size:15px;color:var(--gold);margin-bottom:10px}
.dark-box textarea{color:#F5F0E8;background:#2A2A2A;border-color:#444}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.score-lbl{font-size:11px;color:#888;margin-bottom:2px}
.score-val{font-size:30px;font-family:Georgia,serif;color:var(--gold)}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar-fill{height:100%;background:var(--gold);border-radius:3px}
.status-togs{display:flex;gap:8px;flex-wrap:wrap}
.stog{padding:9px 18px;border-radius:20px;border:2px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;background:var(--cream);color:var(--muted);-webkit-appearance:none}
.stog.shortlist.on{background:#3A7C59;color:white;border-color:#3A7C59}
.stog.ok.on{background:var(--gold);color:white;border-color:var(--gold)}
.stog.discard.on{background:var(--red);color:white;border-color:var(--red)}
.media-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.media-title{font-family:Georgia,serif;font-size:15px;font-weight:600;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.upload-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none}
#fileInput{display:none}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.media-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-thumb .del-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;line-height:24px;text-align:center}
.media-thumb .cover-btn{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:8px;font-size:10px;padding:2px 6px;cursor:pointer;font-weight:600}
.media-thumb .cover-btn.active{background:var(--gold)}
.media-thumb .video-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:white;font-size:10px;padding:2px 6px;border-radius:8px}
.media-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:16px}
.loading-icon{font-size:40px}
.loading-txt{font-family:Georgia,serif;font-size:18px;color:var(--gold)}
</style>
</head>
<body>
<div class="hdr">
  <div class="eye">Relocation · Singapore 2026</div>
  <h1>Apartment Assessment</h1>
  <div class="sub">Giuseppe & Lina · 16 properties</div>
</div>
<div id="status"></div>
<div id="app"></div>
<script>
const HARDCODED_URL="https://script.google.com/macros/s/AKfycbx_ykeulVEGGYHEMzVXf688Qq0CauYGZmC4l2V5DcoEBgdtmvBCc5hPPT0ZkE_v4aoh/exec";
let API_URL=HARDCODED_URL;
try{localStorage.setItem("sg_api_url",HARDCODED_URL);}catch(e){}

const CATS=[
  {icon:"📍",title:"Location & Connectivity",cr:[
    {l:"Proximity to MRT station",p:"must"},{l:"Commute to workplace / CBD",p:"must"},
    {l:"Nearby amenities",p:"imp"},{l:"Neighbourhood safety & vibe",p:"imp"},
    {l:"Noise level",p:"imp"},{l:"Smell (satay street / food odours)",p:"imp"},
  ]},
  {icon:"🏢",title:"Building & Development",cr:[
    {l:"Overall building condition",p:"must"},
    {l:"Number of units (fewer = better)",p:"imp",t:"num",unit:"units"},
    {l:"Lift availability & wait time",p:"imp"},{l:"Security",p:"imp"},
    {l:"Concierge / management"},{l:"Age of building",p:"imp"},
    {l:"Pool"},{l:"Gym"},{l:"BBQ area"},{l:"Tennis court"},{l:"Squash court"},{l:"Other facilities"},
  ]},
  {icon:"🛏️",title:"Unit — Space & Layout",cr:[
    {l:"Furnished status",p:"must",t:"furnished"},
    {l:"Number of bedrooms",p:"must",t:"num",unit:"rooms"},
    {l:"Number of bathrooms",p:"must",t:"num",unit:"toilets"},
    {l:"Size (sqft)",p:"must",t:"num",unit:"sqft",id:"sqft"},
    {l:"Monthly rent (SGD)",p:"must",t:"num",unit:"SGD",id:"rent"},
    {l:"Price per sqft",p:"must",t:"calc"},
    {l:"Windows",p:"imp",t:"window"},{l:"Bathtub present",t:"yn"},
    {l:"Layout flow",p:"must"},{l:"Natural light & ventilation",p:"must"},
    {l:"Bedroom size & wardrobe",p:"imp"},{l:"Living / dining area",p:"imp"},{l:"Balcony"},
  ]},
  {icon:"🔧",title:"Unit — Condition & Fittings",cr:[
    {l:"Dishwasher present",t:"yn"},{l:"Kitchen condition & appliances",p:"must"},
    {l:"Bathroom quality & water pressure",p:"must"},{l:"Air conditioning",p:"imp"},
    {l:"Flooring and walls",p:"imp"},{l:"Storage solutions"},{l:"Internet / cable",p:"imp"},
  ]},
  {icon:"🌿",title:"Environment & Views",cr:[
    {l:"Floor number",p:"imp",t:"num",unit:"floor"},{l:"View from unit",p:"imp"},
    {l:"Direct sunlight exposure",p:"imp"},{l:"Air quality",p:"imp"},{l:"Green space nearby"},
  ]},
  {icon:"💰",title:"Financials & Lease",cr:[
    {l:"Rent negotiable",p:"must",t:"yn"},{l:"Lease term flexibility",p:"must"},
    {l:"Diplomatic clause included",p:"must",t:"yn"},{l:"Included utilities",p:"imp"},
    {l:"Maintenance / service charge",p:"imp"},{l:"Landlord is Singaporean",p:"imp",t:"yn"},
    {l:"Availability / move-in date",p:"must"},
  ]},
  {icon:"✨",title:"Intangibles",cr:[
    {l:"First impression / gut feel",p:"must"},{l:"Could I see myself living here?",p:"must"},
  ]},
];

const BASES=[
  {id:1, name:"MBR #45-09",    full:"Marina Bay Residences #45-09", time:"11:30 AM",top:2010,units:428, sqft:1636,rent:12500,beds:3,avail:"15 July",   furn:"Partial"},
  {id:2, name:"1Shen #20-03",  full:"One Shenton #20-03",           time:"12:00 PM",top:2011,units:341, sqft:1130,rent:7200, beds:2,avail:"Immediate", furn:"Partial/Fully"},
  {id:3, name:"1Shen #45-03",  full:"One Shenton #45-03",           time:"12:15 PM",top:2011,units:341, sqft:2250,rent:13000,beds:4,avail:"Immediate", furn:"Partial"},
  {id:4, name:"Riv #22-05",    full:"Riviere Tower 1 #22-05",       time:"1:00 PM", top:2023,units:455, sqft:1173,rent:9000, beds:3,avail:"20 June",   furn:"Partial"},
  {id:5, name:"MBS #35-04",    full:"Marina Bay Suites #35-04",     time:"1:30 PM", top:2014,units:221, sqft:1625,rent:10000,beds:3,avail:"Immediate", furn:"Partial"},
  {id:6, name:"Altez #52-09",  full:"Altez #52-09",                 time:"2:00 PM", top:2014,units:280, sqft:1175,rent:8500, beds:2,avail:"1 June",    furn:"Partial"},
  {id:7, name:"Riv #24-07",    full:"Riviere Tower 1 #24-07",       time:"2:30 PM", top:2023,units:455, sqft:1173,rent:15000,beds:3,avail:"Immediate", furn:"Partial"},
  {id:8, name:"MBR #16-03",    full:"Marina Bay Residences #16-03", time:"3:30 PM", top:2010,units:428, sqft:1066,rent:11000,beds:2,avail:"Immediate", furn:"Partial"},
  {id:9, name:"MBS #12-03",    full:"Marina Bay Suites #12-03",     time:"4:15 PM", top:2014,units:221, sqft:1593,rent:9800, beds:3,avail:"Immediate", furn:"Partial"},
  {id:10,name:"MBS #61-02",    full:"Marina Bay Suites #61-02",     time:"4:30 PM", top:2014,units:221, sqft:1593,rent:9800, beds:3,avail:"Immediate", furn:"Partial"},
  {id:11,name:"MBS #29-03",    full:"Marina Bay Suites #29-03",     time:"4:45 PM", top:2014,units:221, sqft:1593,rent:9800, beds:3,avail:"Immediate", furn:"Partial"},
  {id:12,name:"M1 B23 #23-28", full:"Marina One Blk 23 #23-28",     time:"5:15 PM", top:2017,units:1042,sqft:1593,rent:11500,beds:3,avail:"15 July",   furn:"Partial"},
  {id:13,name:"M1 Blk21",      full:"Marina One Blk 21",            time:"5:15 PM", top:2017,units:1042,sqft:1593,rent:10550,beds:3,avail:"15 Jun",    furn:"Fully"},
  {id:14,name:"M1 B23 #12-34", full:"Marina One Blk 23 #12-34",     time:"5:30 PM", top:2017,units:1042,sqft:1163,rent:8200, beds:2,avail:"8 July",    furn:"Partial"},
  {id:15,name:"M1 B23 #10-36", full:"Marina One Blk 23 #10-36",     time:"5:45 PM", top:2017,units:1042,sqft:1561,rent:12000,beds:3,avail:"Immediate", furn:"Fully"},
  {id:16,name:"M1 B21 #30-15", full:"Marina One Blk 21 #30-15",     time:"6:00 PM", top:2017,units:1042,sqft:1539,rent:13800,beds:3,avail:"1 July",    furn:"Fully"},
];

let D={}, activeId=1, openCats={}, saveTimer=null;

function emptyApt(b){
  return{id:b.id,ratings:{},notes:{},fields:{sqft:String(b.sqft||0),rent:String(b.rent||0)},
    overall:"",pgLink:"",aptSummary:"",status:"",coverPhotoId:"",coverThumb:"",overrides:{}};
}

function ensureD(){
  BASES.forEach(b=>{
    if(!D[b.id])D[b.id]=emptyApt(b);
    else{
      if(!D[b.id].fields)D[b.id].fields={};
      if(!D[b.id].fields.sqft)D[b.id].fields.sqft=String(b.sqft);
      if(!D[b.id].fields.rent)D[b.id].fields.rent=String(b.rent);
      if(!D[b.id].overrides)D[b.id].overrides={};
      if(D[b.id].aptSummary===undefined)D[b.id].aptSummary="";
      if(D[b.id].status===undefined)D[b.id].status="";
      if(D[b.id].coverPhotoId===undefined)D[b.id].coverPhotoId="";
      if(D[b.id].coverThumb===undefined)D[b.id].coverThumb="";
    }
  });
  CATS.forEach((_,ci)=>{if(openCats[ci]===undefined)openCats[ci]=ci<2;});
}

async function apiCall(params){
  // Use POST for everything to avoid Safari CORS redirect issues
  const r=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify(params),
    redirect:"follow"
  });
  try{
    const text=await r.text();
    return JSON.parse(text);
  }catch(e){return{ok:true};}
}
// Keep apiGet as alias for backward compat (media, folder URL calls)
async function apiGet(params){return apiCall(params);}

async function loadAll(){
  const res=await apiCall({action:"read"});
  if(res.ok&&res.data&&res.data.viewingData){
    try{
      const p=JSON.parse(res.data.viewingData);
      D=p.D||{};
      activeId=p.activeId||1;
    }catch(e){}
  }
  ensureD();
}

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    showStatus("Saving…","var(--gold)",true);
    try{
      const res=await apiCall({action:"write",key:"viewingData",value:JSON.stringify({D,activeId})});
      showStatus("✓ Saved","var(--green)");
    }catch(e){
      showStatus("⚠ "+e.message,"var(--red)",true);
    }
  },700);
}

async function uploadFile(aptName,file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async function(e){
      const base64=e.target.result.split(",")[1];
      showStatus("Uploading…","var(--gold)",true);
      try{
        const body=JSON.stringify({action:"upload",apt:aptName,fileName:file.name,mimeType:file.type,data:base64});
        const r=await fetch(API_URL,{method:"POST",body,redirect:"follow"});
        const text=await r.text();
        let res;try{res=JSON.parse(text);}catch(e){res={ok:true};}
        if(res.ok)resolve(res.file||{});
        else reject(new Error(res.error||"Upload failed"));
      }catch(err){reject(err);}
    };
    reader.readAsDataURL(file);
  });
}

async function loadMedia(aptName){
  try{const res=await apiGet({action:"listMedia",apt:aptName});if(res.ok)return res.files||[];}catch(e){}
  return[];
}

const folderUrlCache={};
async function getDriveFolderUrl(aptName){
  if(folderUrlCache[aptName])return folderUrlCache[aptName];
  try{const res=await apiGet({action:"getFolderUrl",apt:aptName});if(res.ok&&res.url){folderUrlCache[aptName]=res.url;return res.url;}}catch(e){}
  return null;
}

function showStatus(msg,color,persist){
  const el=document.getElementById("status");
  el.textContent=msg;el.style.color=color||"var(--gold)";
  if(el._t)clearTimeout(el._t);
  if(!persist)el._t=setTimeout(()=>el.textContent="",2500);
}

async function initApp(){
  document.getElementById("app").innerHTML='<div class="loading-screen"><div class="loading-icon">🏙️</div><div class="loading-txt">Loading…</div></div>';
  try{
    await loadAll();
  }catch(e){
    // Retry once after 2 seconds
    await new Promise(r=>setTimeout(r,2000));
    try{
      await loadAll();
    }catch(e2){
      document.getElementById("app").innerHTML='<div class="loading-screen"><div class="loading-icon">⚠️</div><div class="loading-txt" style="color:var(--red)">Could not connect.<br>Check your internet and reload.</div></div>';
      return;
    }
  }
  render();
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML='<div class="tabs" id="tabs"></div><div class="content" id="content"></div>';
  renderTabs();
  renderContent();
}

function renderTabs(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML="";
  // Summary tab
  const sumBtn=document.createElement("button");
  sumBtn.className="tab"+(activeId==="summary"?" active":"");
  sumBtn.style.cssText=activeId==="summary"?"":"border-color:var(--gold);color:var(--gold)";
  sumBtn.textContent="📊 Summary";
  sumBtn.onclick=()=>{activeId="summary";save();render();scrollToTop();};
  tabs.appendChild(sumBtn);
  // Apartment tabs
  BASES.forEach(b=>{
    const btn=document.createElement("button");
    btn.className="tab"+(b.id===activeId?" active":"");
    btn.textContent=b.name;
    btn.onclick=()=>{activeId=b.id;save();render();scrollToTop();
      setTimeout(()=>btn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}),50);
    };
    tabs.appendChild(btn);
  });
  // + button
  const addBtn=document.createElement("button");
  addBtn.className="tab";
  addBtn.style.cssText="border-color:var(--green);color:var(--green);font-size:18px;padding:5px 14px";
  addBtn.textContent="＋";
  addBtn.onclick=addApartment;
  tabs.appendChild(addBtn);
}

function addApartment(){
  const name=prompt("Enter apartment name:");
  if(!name||!name.trim())return;
  const id="c"+Date.now();
  D[id]={id,name:name.trim(),full:name.trim(),custom:true,
    ratings:{},notes:{},fields:{sqft:"0",rent:"0"},
    overall:"",pgLink:"",aptSummary:"",status:"",
    coverPhotoId:"",coverThumb:"",overrides:{}};
  // Add to BASES so it shows in tabs
  BASES.push({id,name:name.trim(),full:name.trim(),time:"",top:"",units:"",sqft:0,rent:0,beds:"",avail:"",furn:""});
  activeId=id;
  save();render();scrollToTop();
}

function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});}

function renderContent(){
  const el=document.getElementById("content");
  if(!el)return;
  el.innerHTML="";
  if(activeId==="summary"){renderSummaryPage(el);return;}
  renderAptPage(el);
}

function renderSummaryPage(el){
  const sorted=[...BASES].sort((a,b)=>{
    const da=D[a.id],db=D[b.id];
    const sa=da?calcOverall(da):null,sb=db?calcOverall(db):null;
    if(!sa&&!sb)return 0;if(!sa)return 1;if(!sb)return -1;
    return parseFloat(sb)-parseFloat(sa);
  });

  // Header
  const hdr=document.createElement("div");
  hdr.style.cssText="padding:16px 0 10px 0";
  hdr.innerHTML='<div style="font-family:Georgia,serif;font-size:18px;font-weight:600;color:var(--dark);margin-bottom:2px">🏆 Rankings</div>'
    +'<div style="font-size:12px;color:var(--muted)">Tap any card to open</div>';
  el.appendChild(hdr);

  sorted.forEach((base,i)=>{
    const dd=D[base.id]||{ratings:{},notes:{},fields:{},status:"",aptSummary:"",coverThumb:""};
    const sc=calcOverall(dd);
    const status=dd.status||"";
    const coverThumb=dd.coverThumb||"";

    // Effective values
    const eRent=Number((dd.overrides&&dd.overrides.rent!==undefined)?dd.overrides.rent:base.rent)||0;
    const eSqft=Number((dd.overrides&&dd.overrides.sqft!==undefined)?dd.overrides.sqft:base.sqft)||0;
    const eBeds=(dd.overrides&&dd.overrides.beds!==undefined)?dd.overrides.beds:base.beds;
    const psf=eSqft&&eRent?(eRent/eSqft).toFixed(2):null;

    // Category scores
    const catScores=CATS.map((_,ci)=>catScore(dd,ci));

    // Status badge style
    const statusStyle=status==="shortlist"?"background:#D4EDDA;color:#3A7C59":
      status==="ok"?"background:#FFF3CD;color:#A07820":
      status==="discard"?"background:#FFE5E5;color:var(--red)":"display:none";
    const statusLabel=status==="shortlist"?"⭐ Short listed":status==="ok"?"👍 OK":status==="discard"?"✗ Discarded":"";

    const card=document.createElement("div");
    card.style.cssText="background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer";
    card.onclick=()=>{activeId=base.id;render();scrollToTop();};

    // Top row: cover photo + main info
    const topRow=document.createElement("div");
    topRow.style.cssText="display:flex;gap:0;align-items:stretch";

    // Cover photo (left side)
    const photoEl=document.createElement("div");
    photoEl.style.cssText="width:80px;flex-shrink:0;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden";
    if(coverThumb){
      const img=document.createElement("img");
      img.src=coverThumb;
      img.style.cssText="width:100%;height:100%;object-fit:cover";
      photoEl.appendChild(img);
    }else{
      photoEl.textContent="🏙️";
    }
    topRow.appendChild(photoEl);

    // Main info (right of photo)
    const mainInfo=document.createElement("div");
    mainInfo.style.cssText="flex:1;padding:12px;min-width:0";

    // Name + rank row
    const nameRow=document.createElement("div");
    nameRow.style.cssText="display:flex;align-items:center;gap:8px;margin-bottom:4px";
    const rankBadge=document.createElement("span");
    rankBadge.style.cssText="font-size:11px;font-weight:700;color:var(--muted);background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:1px 6px;flex-shrink:0";
    rankBadge.textContent="#"+(i+1);
    const nameSpan=document.createElement("span");
    nameSpan.style.cssText="font-family:Georgia,serif;font-size:14px;font-weight:600;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    nameSpan.textContent=base.name;
    nameRow.appendChild(rankBadge);
    nameRow.appendChild(nameSpan);
    mainInfo.appendChild(nameRow);

    // Full name
    const fullEl=document.createElement("div");
    fullEl.style.cssText="font-size:10px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    fullEl.textContent=base.full;
    mainInfo.appendChild(fullEl);

    // Key stats grid
    const statsGrid=document.createElement("div");
    statsGrid.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px 8px;margin-bottom:8px";
    [
      ["Rent","SGD "+(eRent?eRent.toLocaleString():"—")],
      ["Size",eSqft?eSqft.toLocaleString()+" sqft":"—"],
      ["Beds",eBeds||"—"],
      ["PSF",psf?"SGD "+psf:"—"],
    ].forEach(([label,val])=>{
      const cell=document.createElement("div");
      cell.innerHTML='<div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:1px">'+label+'</div>'
        +'<div style="font-size:12px;font-weight:700;color:var(--dark);font-family:Georgia,serif">'+val+'</div>';
      statsGrid.appendChild(cell);
    });
    mainInfo.appendChild(statsGrid);

    // Overall score + status badge
    const bottomRow=document.createElement("div");
    bottomRow.style.cssText="display:flex;align-items:center;gap:8px;flex-wrap:wrap";
    const scoreEl=document.createElement("span");
    scoreEl.style.cssText="font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--gold)";
    scoreEl.textContent=sc?sc+"/5":"—";
    bottomRow.appendChild(scoreEl);
    if(status){
      const badge=document.createElement("span");
      badge.style.cssText="font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;"+statusStyle;
      badge.textContent=statusLabel;
      bottomRow.appendChild(badge);
    }
    mainInfo.appendChild(bottomRow);

    // Summary quote inline (compact, left side)
    if(dd.aptSummary){
      const sumEl=document.createElement("div");
      sumEl.style.cssText="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:6px;line-height:1.4";
      sumEl.textContent='"'+dd.aptSummary+'"';
      mainInfo.insertBefore(sumEl,bottomRow);
    }

    topRow.appendChild(mainInfo);
    card.appendChild(topRow);

    // Category scores row
    const catRow=document.createElement("div");
    catRow.style.cssText="display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--border);padding:8px 12px;gap:12px;-webkit-overflow-scrolling:touch";
    catRow.style.cssText+="align-items:center";
    CATS.forEach((cat,ci)=>{
      const s=catScores[ci];
      const cell=document.createElement("div");
      cell.style.cssText="flex-shrink:0;text-align:center";
      cell.innerHTML='<div style="font-size:14px;margin-bottom:2px">'+cat.icon+'</div>'
        +'<div style="font-size:11px;font-weight:700;color:'+(s?'var(--gold)':'var(--border)')+';font-family:Georgia,serif">'+(s||"—")+'</div>';
      catRow.appendChild(cell);
    });
    card.appendChild(catRow);



    el.appendChild(card);
  });
}


function renderAptPage(el){
  const base=BASES.find(b=>b.id===activeId);
  if(!base){el.innerHTML='<div style="padding:20px;color:var(--muted)">Apartment not found</div>';return;}
  const dd=D[activeId];
  if(!dd){D[activeId]=emptyApt(base);}
  const d=D[activeId];

  const eRent=Number(d.overrides&&d.overrides.rent!==undefined?d.overrides.rent:base.rent)||0;
  const eSqft=Number(d.overrides&&d.overrides.sqft!==undefined?d.overrides.sqft:base.sqft)||0;
  const eBeds=d.overrides&&d.overrides.beds!==undefined?d.overrides.beds:base.beds;
  const eUnits=d.overrides&&d.overrides.units!==undefined?d.overrides.units:base.units;
  const eAvail=d.overrides&&d.overrides.avail!==undefined?d.overrides.avail:base.avail;
  const eFurn=d.overrides&&d.overrides.furn!==undefined?d.overrides.furn:base.furn;
  const psf=eSqft&&eRent?(eRent/eSqft).toFixed(2):null;

  // Info card
  const info=document.createElement("div");info.className="info";
  const coverUrl=d.coverThumb||(d.coverPhotoId?"https://drive.google.com/thumbnail?id="+d.coverPhotoId+"&sz=w800":"");
  const coverHtml=coverUrl
    ?'<img class="cover-photo" src="'+coverUrl+'" onclick="window.open(\''+coverUrl+'\',\'_blank\')" onerror="this.style.display=\'none\'">'
    :'<div class="cover-placeholder">📸 Set a cover photo in Photos section below</div>';

  info.innerHTML='<div class="info-time">⏰ '+(base.time||"")+(base.top?" · Built "+base.top:"")+'</div>'+coverHtml+'<div class="info-grid" id="infoGrid"></div>'
    +'<div class="pg-row"><span>PropertyGuru</span><input type="url" id="pgIn" placeholder="Paste URL…" value="'+(d.pgLink||"")+'">'
    +(d.pgLink?'<a id="pgLinkBtn" href="'+d.pgLink+'" target="_blank" style="flex-shrink:0;padding:7px 14px;background:var(--gold);color:white;border-radius:16px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap">Open ↗</a>':'')
    +'</div>'
    +'<div class="apt-summary-row"><div class="il">One-line summary</div><textarea class="apt-summary-input" id="aptSumIn" placeholder="e.g. Great views, small kitchen…" rows="2" style="resize:none;height:auto">'+(d.aptSummary||"")+'</textarea></div>';
  el.appendChild(info);

  // Info grid fields
  const grid=document.getElementById("infoGrid");
  const nameDiv=document.createElement("div");
  nameDiv.innerHTML='<div class="il">Property</div><div class="iv sm">'+(base.full||base.name)+'</div>';
  grid.appendChild(nameDiv);

  [{key:"rent",label:"Rent/mo",gold:true,val:"SGD "+(eRent?eRent.toLocaleString():"—")},
   {key:"sqft",label:"Size",gold:false,val:eSqft?eSqft.toLocaleString()+" sqft":"—"},
   {key:"psf",label:"Price/sqft",gold:true,val:psf?"SGD "+psf:"—",ro:true},
   {key:"beds",label:"Bedrooms",gold:false,val:String(eBeds||"—")},
   {key:"units",label:"Units in bldg",gold:false,val:String(eUnits||"—")},
   {key:"avail",label:"Move-in",gold:false,val:String(eAvail||"—")},
   {key:"furn",label:"Furnished",gold:false,val:String(eFurn||"—")},
  ].forEach(f=>{
    const div=document.createElement("div");
    const valEl=document.createElement("div");
    valEl.className="iv"+(f.gold?" gold":"");
    valEl.textContent=f.val;
    if(!f.ro){
      let lastTap=0;
      const doEdit=()=>startEdit(f.key,valEl,d,base);
      valEl.ondblclick=doEdit;
      valEl.ontouchend=()=>{const now=Date.now();if(now-lastTap<350)doEdit();lastTap=now;};
    }
    div.innerHTML='<div class="il">'+f.label+'</div>';
    div.appendChild(valEl);
    grid.appendChild(div);
  });

  document.getElementById("pgIn").oninput=function(){
    d.pgLink=this.value;
    save();
    renderContent();
  };
  document.getElementById("aptSumIn").oninput=function(){d.aptSummary=this.value;save();};

  // Categories
  CATS.forEach((cat,ci)=>{
    const sec=document.createElement("div");sec.className="cat";
    const sc=catScore(d,ci);
    const isOpen=openCats[ci]!==false;
    const hdr=document.createElement("div");hdr.className="cat-hdr"+(isOpen?"":" closed");
    hdr.innerHTML='<span style="font-size:18px">'+cat.icon+'</span>'
      +'<span style="font-family:Georgia,serif;font-size:15px;font-weight:600;flex:1">'+cat.title+'</span>'
      +'<span style="font-size:12px;color:var(--muted);background:var(--cream);padding:2px 8px;border-radius:10px;border:1px solid var(--border)">'+(sc?sc+"/5":"—")+'</span>'
      +'<span style="font-size:11px;color:var(--muted)">'+(isOpen?"▲":"▼")+'</span>';
    hdr.onclick=()=>{openCats[ci]=!openCats[ci];renderContent();};
    const body=document.createElement("div");body.className="cat-body"+(isOpen?" open":"");
    cat.cr.forEach((cr,ri)=>{
      const key=ci+"-"+ri;
      const row=document.createElement("div");row.className="crit";
      const lbl=document.createElement("div");lbl.className="crit-lbl";
      lbl.innerHTML=cr.l+(cr.p==="must"?' <span class="badge must">Must</span>':cr.p==="imp"?' <span class="badge imp">Important</span>':"");
      row.appendChild(lbl);
      const fv=d.fields[cr.id||key]||"",nv=d.notes[key]||"",rv=d.ratings[key]||0;
      const sqft=parseFloat(d.fields.sqft||eSqft),rent=parseFloat(d.fields.rent||eRent);
      if(cr.t==="calc"){
        const div=document.createElement("div");div.className="calc";
        div.textContent=sqft>0&&rent>0?"SGD "+(rent/sqft).toFixed(2)+" / sqft":"Enter size & rent above";
        row.appendChild(div);
      }else if(cr.t==="num"){
        const nr=document.createElement("div");nr.className="num-row";
        const inp=document.createElement("input");inp.type="number";inp.min=0;inp.placeholder="0";
        inp.value=cr.id?(d.fields[cr.id]||""):fv;
        inp.oninput=function(){const k=cr.id||key;d.fields[k]=this.value;save();if(cr.id==="sqft"||cr.id==="rent")renderContent();};
        const un=document.createElement("span");un.className="num-unit";un.textContent=cr.unit;
        nr.appendChild(inp);nr.appendChild(un);row.appendChild(nr);
        row.appendChild(mkTxt(nv,v=>{d.notes[key]=v;save();}));
      }else if(cr.t==="yn"||cr.t==="furnished"||cr.t==="window"){
        const opts=cr.t==="furnished"?["Fully","Partial","Unfurnished"]:cr.t==="window"?["Full height","Hip height","Mixed"]:["Yes","No","Unknown"];
        row.appendChild(mkTogs(opts,fv,v=>{d.fields[key]=v;save();renderContent();}));
        row.appendChild(mkTxt(nv,v=>{d.notes[key]=v;save();},cr.t==="furnished"?"What's included?":"Notes..."));
      }else{
        row.appendChild(mkStars(rv,v=>{d.ratings[key]=v;save();renderContent();}));
        row.appendChild(mkTxt(nv,v=>{d.notes[key]=v;save();}));
      }
      body.appendChild(row);
    });
    sec.appendChild(hdr);sec.appendChild(body);el.appendChild(sec);
  });

  // Photos & Videos
  const mediaDiv=document.createElement("div");mediaDiv.className="media-section";
  mediaDiv.innerHTML='<div class="media-title"><span>📸 Photos & Videos</span>'
    +'<div style="display:flex;gap:8px;align-items:center">'
    +'<a id="driveFolderLink" href="https://drive.google.com/drive/search?q='+encodeURIComponent(base.full||base.name)+'" target="_blank" style="font-size:12px;color:var(--gold);text-decoration:none;font-weight:600;border:1px solid var(--gold);padding:6px 12px;border-radius:16px">📁 Drive</a>'
    +'<button class="upload-btn" onclick="document.getElementById(\'fileInput\').click()">＋ Add</button>'
    +'</div></div>'
    +'<p style="font-size:11px;color:var(--muted);margin-bottom:8px">Full-res photos saved to Google Drive. Tap ☆ Cover to show in summary.</p>'
    +'<input type="file" id="fileInput" accept="image/*,video/*" multiple>'
    +'<div id="mediaGrid" class="media-grid"><div class="media-empty">Loading…</div></div>';
  el.appendChild(mediaDiv);

  getDriveFolderUrl(base.full||base.name).then(url=>{const lnk=document.getElementById("driveFolderLink");if(lnk&&url)lnk.href=url;}).catch(()=>{});

  document.getElementById("fileInput").onchange=async function(){
    const files=Array.from(this.files);if(!files.length)return;
    document.getElementById("mediaGrid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:12px;font-size:12px;color:var(--gold)">Uploading…</div>';
    for(const file of files){
      try{showStatus("Uploading "+file.name+"…","var(--gold)",true);await uploadFile(base.full||base.name,file);showStatus("✓ Uploaded","var(--green)");}
      catch(e){showStatus("⚠ Upload failed","var(--red)",true);}
    }
    renderMediaGrid(base.full||base.name,d);this.value="";
  };
  renderMediaGrid(base.full||base.name,d);

  // Score + Status
  const sc=calcOverall(d),pct=sc?parseFloat(sc)/5*100:0;
  const rated=Object.values(d.ratings).filter(r=>r>0).length;
  const box=document.createElement("div");box.className="dark-box";
  box.innerHTML='<h3>Overall impression</h3>'
    +'<textarea id="overallNote" placeholder="General notes…">'+(d.overall||"")+'</textarea>'
    +'<h3 style="margin-top:16px">Score</h3>'
    +'<div class="score-grid"><div><div class="score-lbl">Overall</div><div class="score-val">'+(sc?sc+"/5":"—")+'</div></div>'
    +'<div><div class="score-lbl">Criteria rated</div><div class="score-val">'+rated+'</div></div></div>'
    +'<div class="bar"><div class="bar-fill" style="width:'+pct+'%"></div></div>'
    +'<h3 style="margin-bottom:12px">Status</h3>'
    +'<div class="status-togs">'
    +'<button class="stog shortlist'+(d.status==="shortlist"?" on":"")+ '" onclick="setStatus(\'shortlist\')">⭐ Short list</button>'
    +'<button class="stog ok'+(d.status==="ok"?" on":"")+ '" onclick="setStatus(\'ok\')">👍 OK</button>'
    +'<button class="stog discard'+(d.status==="discard"?" on":"")+ '" onclick="setStatus(\'discard\')">✗ Discard</button>'
    +'</div>';
  el.appendChild(box);
  document.getElementById("overallNote").oninput=function(){d.overall=this.value;save();};
}

function setStatus(val){
  const d=D[activeId];if(!d)return;
  d.status=d.status===val?"":val;
  save();renderContent();
}

function startEdit(key,valEl,d,base){
  const cur=d.overrides&&d.overrides[key]!==undefined?d.overrides[key]:base[key];
  const inp=document.createElement("input");inp.className="iv-edit";
  inp.value=String(cur||"");
  inp.type=(key==="rent"||key==="sqft"||key==="beds"||key==="units")?"number":"text";
  valEl.replaceWith(inp);inp.focus();inp.select();
  function commit(){
    if(!d.overrides)d.overrides={};
    d.overrides[key]=inp.type==="number"?Number(inp.value):inp.value;
    save();renderContent();
  }
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.onblur=null;renderContent();}};
}

async function renderMediaGrid(aptName,d){
  const grid=document.getElementById("mediaGrid");if(!grid)return;
  const files=await loadMedia(aptName);
  if(!files.length){grid.innerHTML='<div class="media-empty" style="grid-column:1/-1">No photos yet — tap + Add to upload</div>';return;}
  grid.innerHTML="";
  files.forEach(f=>{
    const div=document.createElement("div");div.className="media-thumb";
    const isCover=d&&d.coverPhotoId===f.id;
    if(f.mimeType&&f.mimeType.startsWith("image/")){
      div.innerHTML='<img src="'+(f.thumb||f.url)+'" loading="lazy" onclick="window.open(\''+f.url+'\',\'_blank\')">';
      div.innerHTML+='<button class="cover-btn'+(isCover?" active":"")+'" onclick="setCover(\''+f.id+'\',\''+f.thumb+'\')">'+( isCover?"★ Cover":"☆ Cover")+'</button>';
    }else{
      div.innerHTML='<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="window.open(\''+f.url+'\',\'_blank\')"><span style="font-size:32px">🎬</span></div><span class="video-badge">VIDEO</span>';
    }
    div.innerHTML+='<button class="del-btn" onclick="deleteMedia(\''+f.id+'\',\''+aptName+'\')">×</button>';
    grid.appendChild(div);
  });
}

function setCover(fileId,thumbUrl){
  const d=D[activeId];if(!d)return;
  if(d.coverPhotoId===fileId){d.coverPhotoId="";d.coverThumb="";}
  else{
    d.coverPhotoId=fileId;
    if(thumbUrl&&thumbUrl!=="undefined"){
      const img=new Image();img.crossOrigin="anonymous";
      img.onload=function(){
        const MAX=120,canvas=document.createElement("canvas");
        let w=img.width,h=img.height;
        if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        d.coverThumb=canvas.toDataURL("image/jpeg",0.7);
        save();
      };
      img.onerror=()=>{d.coverThumb="";save();};
      img.src=thumbUrl;
    }
  }
  save();renderContent();
}

async function deleteMedia(fileId,aptName){
  if(!confirm("Delete this photo/video?"))return;
  const d=D[activeId];
  if(d&&d.coverPhotoId===fileId){d.coverPhotoId="";d.coverThumb="";}
  try{
    const body=JSON.stringify({action:"delete",fileId});
    await fetch(API_URL,{method:"POST",body,redirect:"follow"});
    showStatus("Deleted","var(--green)");
  }catch(e){showStatus("⚠ Delete failed","var(--red)",true);}
  renderMediaGrid(aptName,d);
}

function mkStars(val,onChange){
  const div=document.createElement("div");div.className="stars";
  for(let s=1;s<=5;s++){
    const sp=document.createElement("span");sp.className="star"+(val>=s?" on":"");sp.textContent="★";
    const sv=s;sp.onclick=()=>onChange(val===sv?0:sv);div.appendChild(sp);
  }return div;
}
function mkTxt(val,onChange,ph="Notes..."){
  const ta=document.createElement("textarea");ta.value=val||"";ta.placeholder=ph;
  ta.oninput=function(){onChange(this.value);};return ta;
}
function mkTogs(opts,val,onChange){
  const div=document.createElement("div");div.className="togs";
  opts.forEach(o=>{
    const b=document.createElement("button");b.className="tog"+(val===o?" on":"");b.textContent=o;
    b.onclick=()=>onChange(val===o?null:o);div.appendChild(b);
  });return div;
}
function catScore(d,ci){
  let t=0,n=0;
  CATS[ci].cr.forEach((cr,ri)=>{if(cr.t)return;const r=d.ratings[ci+"-"+ri];if(r){t+=r;n++;}});
  return n?(t/n).toFixed(1):null;
}
function calcOverall(d){
  let t=0,n=0;CATS.forEach((_,ci)=>{const s=catScore(d,ci);if(s){t+=parseFloat(s);n++;}});
  return n?(t/n).toFixed(1):null;
}

initApp();
</script>
