<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Apartment Viewings SG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F0E8;min-height:100vh;padding-bottom:80px}
:root{--gold:#C9A84C;--cream:#F5F0E8;--dark:#1A1A1A;--border:#DDD8CE;--muted:#6B6560;--card:#FDFAF5;--green:#3A7C59;--red:#9B3A3A}
.hdr{text-align:center;padding:16px 16px 12px;border-bottom:1px solid var(--border);background:var(--cream);position:sticky;top:0;z-index:10}
.hdr .eye{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.hdr h1{font-family:Georgia,serif;font-size:20px;font-weight:600;color:var(--dark);margin-bottom:2px}
.hdr .sub{font-size:11px;color:var(--muted)}
#status{text-align:center;font-size:12px;font-weight:600;padding:4px;min-height:20px;background:var(--cream)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--cream);border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;white-space:nowrap;font-size:11px;font-weight:600;background:var(--card);color:var(--muted);-webkit-appearance:none}
.tab.active{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.tab.summary-tab{border-color:var(--gold);color:var(--gold)}
.tab.summary-tab.active{background:var(--gold);color:white;border-color:var(--gold)}
.content{padding:0 16px}
/* Info card */
.info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.info-time{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:8px}
/* Cover photo in info card */
.cover-photo{width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:10px;cursor:pointer}
.cover-placeholder{width:100%;height:80px;background:var(--cream);border:2px dashed var(--border);border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:10px}
.il{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.iv{font-size:14px;font-weight:700;font-family:Georgia,serif;color:var(--dark);cursor:pointer}
.iv.gold{color:var(--gold)}.iv.sm{font-size:11px}
.iv-edit{font-size:13px;font-weight:600;color:var(--dark);background:var(--cream);border:1px solid var(--gold);border-radius:6px;padding:4px 8px;outline:none;width:100%;font-family:-apple-system,sans-serif}
.pg-row{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.pg-row span{font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase}
.pg-row input{flex:1;font-size:12px;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
/* One-line summary */
.apt-summary-row{padding-top:10px;border-top:1px solid var(--border);margin-top:4px}
.apt-summary-row .il{margin-bottom:4px}
.apt-summary-input{width:100%;font-size:13px;font-weight:500;color:var(--dark);background:transparent;border:none;border-bottom:1px solid var(--border);padding:4px 0;outline:none;font-family:-apple-system,sans-serif}
.apt-summary-input:focus{border-bottom-color:var(--gold)}
/* Category */
.cat{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.cat-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.cat-hdr.closed{border-bottom:none}
.cat-body{padding:0 16px;display:none}
.cat-body.open{display:block}
.crit{padding:12px 0;border-bottom:1px solid var(--border)}
.crit:last-child{border-bottom:none}
.crit-lbl{font-size:13px;font-weight:600;color:var(--dark);margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px}
.must{background:#FFE5E5;color:var(--red)}.imp{background:#E8D5A3;color:#A07820}
.stars{display:flex;gap:8px;margin-bottom:8px}
.star{font-size:30px;cursor:pointer;color:var(--border);user-select:none;line-height:1}
.star.on{color:var(--gold)}
textarea{width:100%;font-size:13px;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:7px 10px;resize:vertical;outline:none;min-height:40px;font-family:-apple-system,sans-serif;-webkit-appearance:none;box-sizing:border-box}
.togs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tog{padding:8px 16px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:600;background:var(--cream);color:var(--muted);-webkit-appearance:none}
.tog.on{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.num-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.num-row input{width:100px;font-size:16px;font-weight:700;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:7px 10px;outline:none;-webkit-appearance:none}
.num-unit{font-size:12px;color:var(--muted)}
.calc{padding:10px 14px;background:#E8D5A3;border:1px solid var(--gold);border-radius:8px;margin-bottom:8px;font-size:15px;font-weight:700;color:var(--dark);font-family:Georgia,serif}
.dark-box{background:var(--dark);border-radius:12px;padding:18px;margin-top:10px;color:#F5F0E8}
.dark-box h3{font-family:Georgia,serif;font-size:15px;color:var(--gold);margin-bottom:10px}
.dark-box textarea{color:#F5F0E8;background:#2A2A2A;border-color:#444}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.score-lbl{font-size:11px;color:#888;margin-bottom:2px}
.score-val{font-size:30px;font-family:Georgia,serif;color:var(--gold)}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar-fill{height:100%;background:var(--gold);border-radius:3px}
/* Status toggles */
.status-togs{display:flex;gap:8px;flex-wrap:wrap}
.stog{padding:9px 18px;border-radius:20px;border:2px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;background:var(--cream);color:var(--muted);-webkit-appearance:none;transition:all .15s}
.stog.shortlist.on{background:#3A7C59;color:white;border-color:#3A7C59}
.stog.ok.on{background:var(--gold);color:white;border-color:var(--gold)}
.stog.discard.on{background:var(--red);color:white;border-color:var(--red)}
/* Media */
.media-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.media-title{font-family:Georgia,serif;font-size:15px;font-weight:600;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.upload-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:13px;font-weight:600;cursor:pointer;-webkit-appearance:none}
#fileInput{display:none}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.media-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd}
.media-thumb img{width:100%;height:100%;object-fit:cover}
.media-thumb .del-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;line-height:24px;text-align:center}
.media-thumb .cover-btn{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:8px;font-size:10px;padding:2px 6px;cursor:pointer;font-weight:600}
.media-thumb .cover-btn.active{background:var(--gold);color:white}
.media-thumb .video-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:white;font-size:10px;padding:2px 6px;border-radius:8px}
.media-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0}
/* Summary page */
.sum-page{padding:12px 16px}
.sum-page h2{font-family:Georgia,serif;font-size:18px;color:var(--dark);margin-bottom:4px}
.sum-page .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.apt-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.apt-card:active{background:#EDE8E0}
.apt-card-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--cream)}
.apt-card-thumb-placeholder{width:60px;height:60px;border-radius:8px;background:var(--cream);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.apt-card-body{flex:1;min-width:0}
.apt-card-name{font-family:Georgia,serif;font-size:14px;font-weight:600;color:var(--dark);margin-bottom:2px}
.apt-card-full{font-size:11px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apt-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.apt-card-score{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--gold)}
.apt-status-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.apt-status-badge.shortlist{background:#D4EDDA;color:#3A7C59}
.apt-status-badge.ok{background:#FFF3CD;color:#A07820}
.apt-status-badge.discard{background:#FFE5E5;color:var(--red)}
.apt-card-summary{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.rank-num{font-size:22px;font-weight:700;color:var(--border);font-family:Georgia,serif;min-width:28px;text-align:center;margin-top:4px}
/* Loading */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:16px}
.loading-icon{font-size:40px}
.loading-txt{font-family:Georgia,serif;font-size:18px;color:var(--gold)}
.setup{margin:20px 16px;padding:20px;background:var(--card);border:2px solid var(--gold);border-radius:12px}
.setup h2{font-family:Georgia,serif;font-size:18px;color:var(--dark);margin-bottom:10px}
.setup p{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.setup input{width:100%;font-size:13px;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px;outline:none;margin-bottom:12px;font-family:-apple-system,sans-serif}
.btn-gold{display:block;width:100%;padding:13px;border-radius:24px;border:none;cursor:pointer;font-size:14px;font-weight:700;background:var(--gold);color:white;-webkit-appearance:none}
</style>
</head>

    {l:"First impression / gut feel",p:"must"},{l:"Could I see myself living here?",p:"must"},
  ]},

const BASES=[
  {id:1, name:"MBR #45-09",    full:"Marina Bay Residences #45-09", time:"11:30 AM",top:2010,units:428, sqft:1636,rent:12500,beds:3,avail:"15 July",   furn:"Partial"},
  {id:2, name:"1Shen #20-03",  full:"One Shenton #20-03",           time:"12:00 PM",top:2011,units:341, sqft:1130,rent:7200, beds:2,avail:"Immediate", furn:"Partial/Fully"},

  {id:4, name:"Riv #22-05",    full:"Riviere Tower 1 #22-05",       time:"1:00 PM", top:2023,units:455, sqft:1173,rent:9000, beds:3,avail:"20 June",   furn:"Partial"},

  {id:11,name:"MBS #29-03",    full:"Marina Bay Suites #29-03",     time:"4:45 PM", top:2014,units:221, sqft:1593,rent:9800, beds:3,avail:"Immediate", furn:"Partial"},
  {id:12,name:"M1 B23 #23-28", full:"Marina One Blk 23 #23-28",     time:"5:15 PM", top:2017,units:1042,sqft:1593,rent:11500,beds:3,avail:"15 July",   furn:"Partial"},
  {id:13,name:"M1 Blk21",      full:"Marina One Blk 21",            time:"5:15 PM", top:2017,units:1042,sqft:1593,rent:10550,beds:3,avail:"15 Jun",    furn:"Fully"},
  {id:14,name:"M1 B23 #12-34", full:"Marina One Blk 23 #12-34",     time:"5:30 PM", top:2017,units:1042,sqft:1163,rent:8200, beds:2,avail:"8 July",    furn:"Partial"},
  {id:15,name:"M1 B23 #10-36", full:"Marina One Blk 23 #10-36",     time:"5:45 PM", top:2017,units:1042,sqft:1561,rent:12000,beds:3,avail:"Immediate", furn:"Fully"},
  {id:16,name:"M1 B21 #30-15", full:"Marina One Blk 21 #30-15",     time:"6:00 PM", top:2017,units:1042,sqft:1539,rent:13800,beds:3,avail:"1 July",    furn:"Fully"},
];

// Fields that are editable in info card (double-tap)
const INFO_FIELDS=[
  {key:"rent",   label:"Rent/mo",     gold:true,  fmt:v=>"SGD "+Number(v).toLocaleString()},
  {key:"sqft",   label:"Size",        gold:false, fmt:v=>Number(v).toLocaleString()+" sqft"},
  {key:"beds",   label:"Bedrooms",    gold:false, fmt:v=>v},
  {key:"units",  label:"Units in bldg",gold:false,fmt:v=>v},
  {key:"avail",  label:"Move-in",     gold:false, fmt:v=>v},
  {key:"furn",   label:"Furnished",   gold:false, fmt:v=>v},
];

let D={}, activeId="summary", openCats={}, saveTimer=null;

function emptyApt(b){
  return{id:b.id,ratings:{},notes:{},fields:{sqft:String(b.sqft),rent:String(b.rent)},
    overall:"",pgLink:"",aptSummary:"",status:"",coverPhotoId:"",
    // overrides for info card fields
    overrides:{}};
}

function ensureD(){
  BASES.forEach(b=>{
    if(!D[b.id]){D[b.id]=emptyApt(b);}
    else{
      if(!D[b.id].fields)D[b.id].fields={};
      if(!D[b.id].fields.sqft)D[b.id].fields.sqft=String(b.sqft);
      if(!D[b.id].fields.rent)D[b.id].fields.rent=String(b.rent);
      if(!D[b.id].overrides)D[b.id].overrides={};
      if(D[b.id].aptSummary===undefined)D[b.id].aptSummary="";
      if(D[b.id].status===undefined)D[b.id].status="";
      if(D[b.id].coverPhotoId===undefined)D[b.id].coverPhotoId="";
    }
  });
  CATS.forEach((_,ci)=>{if(openCats[ci]===undefined)openCats[ci]=ci<2;});
}

// Get effective value for an info field (override or base)
function getField(dd,base,key){
  return dd.overrides&&dd.overrides[key]!==undefined ? dd.overrides[key] : base[key];
}

// ── API ───────────────────────────────────────────────────────────────────────
async function apiGet(params){
  const r=await fetch(API_URL+"?"+new URLSearchParams(params),{redirect:"follow"});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
async function apiPost(body){
  // Use POST for uploads (large payloads), GET for everything else
  if(body.action==="upload"||body.action==="delete"){
    try{
      const r=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain"},
        body:JSON.stringify(body),
        redirect:"follow"
      });
      const text=await r.text();
      try{return JSON.parse(text);}catch(e){return{ok:true};}
    }catch(e){
      // CORS fallback: try GET without the binary data
      return{ok:false,error:e.message};
    }
  }
  // All other actions via GET
  const params={...body};
  if(params.value)params.value=encodeURIComponent(params.value);
  const r=await fetch(API_URL+"?"+new URLSearchParams(params),{redirect:"follow"});
  try{
    const text=await r.text();
    return JSON.parse(text);
  }catch(e){
    return{ok:true};
  }
}

async function loadAll(){
  const res=await apiGet({action:"read"});
  if(res.ok&&res.data&&res.data.viewingData){
    try{const p=JSON.parse(res.data.viewingData);D=p.D||{};activeId=p.activeId||"summary";}catch(e){}
  }
  ensureD();
}

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    showStatus("Saving…","var(--gold)",true);
    try{
      const res=await apiPost({action:"write",key:"viewingData",value:JSON.stringify({D,activeId})});
      try{localStorage.setItem("sg26_local",JSON.stringify({D,activeId}));}catch(e2){}
      if(res&&res.ok){
        showStatus("✓ Saved & synced","var(--green)");
      }else{
        showStatus("⚠ Sync error — retrying","#E8A020",true);
      }
    }catch(e){
      try{localStorage.setItem("sg26_local",JSON.stringify({D,activeId}));}catch(e2){}
      showStatus("⚠ Could not reach server","var(--red)",true);
    }
  },700);
}

async function loadMedia(aptName){
  try{const res=await apiGet({action:"listMedia",apt:aptName});if(res.ok)return res.files||[];}catch(e){}
  return[];
}

const CHUNK_SIZE = 100000; // ~100KB per chunk, safe for URL length

async function uploadFile(aptName, file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64 = e.target.result.split(",")[1];
      const uploadId = Date.now() + "_" + file.name;
      const totalChunks = Math.ceil(base64.length / CHUNK_SIZE);
      try {
        let lastRes = null;
        for (let i = 0; i < totalChunks; i++) {
          const chunk = base64.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          const res = await apiGet({
            action: "upload",
            apt: aptName,
            fileName: file.name,
            mimeType: file.type,
            data: encodeURIComponent(chunk),
            uploadId,
            chunkIdx: i,
            totalChunks
          });
          lastRes = res;
          showStatus(`Uploading… ${Math.round((i+1)/totalChunks*100)}%`, "var(--gold)", true);
        }
        if (lastRes && lastRes.ok && lastRes.file) resolve(lastRes.file);
        else if (lastRes && lastRes.ok) resolve({});
        else reject(new Error(lastRes?.error || "Upload failed"));
      } catch(err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

// Get or cache the Drive folder URL for an apartment
const folderUrlCache = {};
async function getDriveFolderUrl(aptName) {
  if (folderUrlCache[aptName]) return folderUrlCache[aptName];
  try {
    const res = await apiGet({ action: "getFolderUrl", apt: aptName });
    if (res.ok && res.url) { folderUrlCache[aptName] = res.url; return res.url; }
  } catch(e) {}
  return null;
}

function showStatus(msg,color,persist){
  const el=document.getElementById("status");
  el.textContent=msg;el.style.color=color||"var(--gold)";
  if(el._t)clearTimeout(el._t);
  if(!persist)el._t=setTimeout(()=>el.textContent="",2500);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function initApp(){
  document.getElementById("app").innerHTML=`<div class="loading-screen"><div class="loading-icon">🏙️</div><div class="loading-txt">Loading…</div></div>`;
  try{await loadAll();render();}
  catch(e){
    try{const local=localStorage.getItem("sg26_local");if(local){const p=JSON.parse(local);D=p.D||{};activeId=p.activeId||"summary";}}catch(e2){}
    ensureD();showStatus("⚠ Offline — showing local data","#E8A020",true);render();
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){renderTabs();renderContent();}

function renderTabs(){
  let app=document.getElementById("app");
  if(!document.getElementById("tabs")){
    app.innerHTML=`<div class="tabs" id="tabs"></div><div class="content" id="content"></div>`;
  }
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  // Summary tab first
  const sumBtn=document.createElement("button");
  sumBtn.className="tab summary-tab"+(activeId==="summary"?" active":"");
  sumBtn.textContent="📊 Summary";
  sumBtn.onclick=()=>{activeId="summary";save();renderTabs();renderContent();scrollToTop();};
  tabs.appendChild(sumBtn);
  // Apartment tabs
  BASES.forEach(b=>{
    const dd=D[b.id];
    const sc=dd?calcOverall(dd):null;
    const btn=document.createElement("button");
    btn.className="tab"+(b.id===activeId?" active":"");
    btn.textContent=b.name;
    btn.onclick=()=>{activeId=b.id;save();renderTabs();renderContent();scrollToTop();
      setTimeout(()=>document.querySelector(".tab.active")?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"}),50);
    };
    tabs.appendChild(btn);
  });
}

function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"});}

// ── Summary page ──────────────────────────────────────────────────────────────
function renderContent(){
  const el=document.getElementById("content");if(!el)return;
  el.innerHTML="";
  if(activeId==="summary"){renderSummaryPage(el);return;}
  renderAptPage(el);
}

function renderSummaryPage(el){
  const sorted=[...BASES].sort((a,b)=>{
    const sa=calcOverall(D[a.id]),sb=calcOverall(D[b.id]);
    if(!sa&&!sb)return0;if(!sa)return1;if(!sb)return-1;
    return parseFloat(sb)-parseFloat(sa);
  });
  const div=document.createElement("div");div.className="sum-page";
  div.innerHTML=`<h2>🏆 Rankings</h2><p class="sub">Tap any apartment to open its assessment</p>`;
  sorted.forEach((base,i)=>{
    const dd=D[base.id];if(!dd)return;
    const sc=calcOverall(dd);
    const status=dd.status||"";
    const statusHtml=status==="shortlist"?`<span class="apt-status-badge shortlist">⭐ Short listed</span>`:
      status==="ok"?`<span class="apt-status-badge ok">👍 OK</span>`:
      status==="discard"?`<span class="apt-status-badge discard">✗ Discarded</span>`:"";
    const card=document.createElement("div");card.className="apt-card";
    card.onclick=()=>{activeId=base.id;renderTabs();renderContent();scrollToTop();};
    // Cover photo or placeholder
    const coverUrl=dd.coverThumb||(dd.coverPhotoId?`https://drive.google.com/thumbnail?id=${dd.coverPhotoId}&sz=w120`:"");
    const thumbHtml=coverUrl
      ?`<img class="apt-card-thumb" src="${coverUrl}" onerror="this.style.display='none'">`
      :`<div class="apt-card-thumb-placeholder">🏙️</div>`;
    card.innerHTML=`
      <div class="rank-num">${i+1}</div>
      ${thumbHtml}
      <div class="apt-card-body">
        <div class="apt-card-name">${base.name}</div>
        <div class="apt-card-full">${base.full}</div>
        <div class="apt-card-meta">
          <span class="apt-card-score">${sc?sc+"/5":"—"}</span>
          ${statusHtml}
        </div>
        ${dd.aptSummary?`<div class="apt-card-summary">"${dd.aptSummary}"</div>`:""}
      </div>`;
    div.appendChild(card);
  });
  el.appendChild(div);
}

// ── Apartment detail page ─────────────────────────────────────────────────────
function renderAptPage(el){
  const base=BASES.find(b=>b.id===activeId);
  const dd=D[activeId];if(!dd)return;

  // Compute effective values (override > base)
  const eRent=Number(dd.overrides?.rent||base.rent);
  const eSqft=Number(dd.overrides?.sqft||base.sqft);
  const eBeds=dd.overrides?.beds||base.beds;
  const eUnits=dd.overrides?.units||base.units;
  const eAvail=dd.overrides?.avail||base.avail;
  const eFurn=dd.overrides?.furn||base.furn;
  const psf=eSqft&&eRent?(eRent/eSqft).toFixed(2):null;

  // Info card
  const info=document.createElement("div");info.className="info";

  // Cover photo area
  const coverUrl=dd.coverThumb||(dd.coverPhotoId?`https://drive.google.com/thumbnail?id=${dd.coverPhotoId}&sz=w800`:"");
  const coverHtml=coverUrl
    ?`<img class="cover-photo" src="${coverUrl}" onclick="window.open('${coverUrl}','_blank')" onerror="this.style.display='none'">`
    :`<div class="cover-placeholder" onclick="document.getElementById('fileInput').click()">📸 Tap Photos below to add cover image</div>`;

  info.innerHTML=`
    <div class="info-time">⏰ ${base.time} · Built ${base.top}</div>
    ${coverHtml}
    <div class="info-grid" id="infoGrid"></div>
    <div class="pg-row">
      <span>PropertyGuru</span>
      <input type="url" id="pgIn" placeholder="Paste URL…" value="${dd.pgLink||""}">
      ${dd.pgLink?`<a href="${dd.pgLink}" target="_blank" style="font-size:20px;text-decoration:none">🔗</a>`:""}
    </div>
    <div class="apt-summary-row">
      <div class="il">One-line summary</div>
      <input class="apt-summary-input" id="aptSumIn" type="text" placeholder="e.g. Great views, small kitchen, good price…" value="${dd.aptSummary||""}">
    </div>`;
  el.appendChild(info);

  // Build editable info grid
  const grid=document.getElementById("infoGrid");
  // Property name (non-editable)
  const nameDiv=document.createElement("div");
  nameDiv.innerHTML=`<div class="il">Property</div><div class="iv sm">${base.full}</div>`;
  grid.appendChild(nameDiv);

  // Editable fields
  const fields=[
    {key:"rent",label:"Rent/mo",gold:true,val:"SGD "+eRent.toLocaleString()},
    {key:"sqft",label:"Size",gold:false,val:eSqft.toLocaleString()+" sqft"},
    {key:"psf",label:"Price/sqft",gold:true,val:psf?"SGD "+psf:"—",readonly:true},
    {key:"beds",label:"Bedrooms",gold:false,val:String(eBeds)},
    {key:"units",label:"Units in bldg",gold:false,val:String(eUnits)},
    {key:"avail",label:"Move-in",gold:false,val:String(eAvail)},
    {key:"furn",label:"Furnished",gold:false,val:String(eFurn)},
  ];

  fields.forEach(f=>{
    const d=document.createElement("div");
    const valEl=document.createElement("div");
    valEl.className="iv"+(f.gold?" gold":"");
    valEl.textContent=f.val;
    valEl.title="Double-tap to edit";
    if(!f.readonly){
      valEl.ondblclick=()=>startEditField(f.key,valEl,dd,base,el);
      // On mobile, double-tap = two quick taps
      let lastTap=0;
      valEl.ontouchend=()=>{const now=Date.now();if(now-lastTap<350)startEditField(f.key,valEl,dd,base,el);lastTap=now;};
    }
    d.innerHTML=`<div class="il">${f.label}</div>`;
    d.appendChild(valEl);
    grid.appendChild(d);
  });

  document.getElementById("pgIn").oninput=function(){dd.pgLink=this.value;save();};
  document.getElementById("aptSumIn").oninput=function(){dd.aptSummary=this.value;save();};

  // Categories
  CATS.forEach((cat,ci)=>{
    const sec=document.createElement("div");sec.className="cat";
    const sc=catScore(dd,ci);
    const isOpen=openCats[ci]!==false;
    const hdr=document.createElement("div");hdr.className="cat-hdr"+(isOpen?"":" closed");
    hdr.innerHTML=`<span style="font-size:18px">${cat.icon}</span>
      <span style="font-family:Georgia,serif;font-size:15px;font-weight:600;flex:1">${cat.title}</span>
      <span style="font-size:12px;color:var(--muted);background:var(--cream);padding:2px 8px;border-radius:10px;border:1px solid var(--border)">${sc?sc+"/5":"—"}</span>
      <span style="font-size:11px;color:var(--muted)">${isOpen?"▲":"▼"}</span>`;
    hdr.onclick=()=>{openCats[ci]=!openCats[ci];renderContent();};
    const body=document.createElement("div");body.className="cat-body"+(isOpen?" open":"");
    cat.cr.forEach((cr,ri)=>{
      const key=ci+"-"+ri;
      const row=document.createElement("div");row.className="crit";
      const lbl=document.createElement("div");lbl.className="crit-lbl";
      lbl.innerHTML=cr.l+(cr.p==="must"?' <span class="badge must">Must</span>':cr.p==="imp"?' <span class="badge imp">Important</span>':"");
      row.appendChild(lbl);
      const fv=dd.fields[cr.id||key]||"",nv=dd.notes[key]||"",rv=dd.ratings[key]||0;
      const sqft=parseFloat(dd.fields.sqft||eSqft),rent=parseFloat(dd.fields.rent||eRent);
      if(cr.t==="calc"){
        const d=document.createElement("div");d.className="calc";
        d.textContent=sqft>0&&rent>0?"SGD "+(rent/sqft).toFixed(2)+" / sqft":"Enter size & rent above";
        row.appendChild(d);
      }else if(cr.t==="num"){
        const nr=document.createElement("div");nr.className="num-row";
        const inp=document.createElement("input");inp.type="number";inp.min=0;inp.placeholder="0";
        inp.value=cr.id?(dd.fields[cr.id]||""):fv;
        inp.oninput=function(){const k=cr.id||key;dd.fields[k]=this.value;save();if(cr.id==="sqft"||cr.id==="rent")renderContent();};
        const un=document.createElement("span");un.className="num-unit";un.textContent=cr.unit;
        nr.appendChild(inp);nr.appendChild(un);row.appendChild(nr);
        row.appendChild(mkTxt(nv,v=>{dd.notes[key]=v;save();}));
      }else if(cr.t==="yn"||cr.t==="furnished"||cr.t==="window"){
        const opts=cr.t==="furnished"?["Fully","Partial","Unfurnished"]:cr.t==="window"?["Full height","Hip height","Mixed"]:["Yes","No","Unknown"];
        row.appendChild(mkTogs(opts,fv,v=>{dd.fields[key]=v;save();renderContent();}));
        row.appendChild(mkTxt(nv,v=>{dd.notes[key]=v;save();},cr.t==="furnished"?"What's included?":"Notes..."));
      }else{
        row.appendChild(mkStars(rv,v=>{dd.ratings[key]=v;save();renderContent();}));
        row.appendChild(mkTxt(nv,v=>{dd.notes[key]=v;save();}));
      }
      body.appendChild(row);
    });
    sec.appendChild(hdr);sec.appendChild(body);el.appendChild(sec);
  });

  // Photos & Videos
  const mediaDiv=document.createElement("div");mediaDiv.className="media-section";
  mediaDiv.innerHTML=`
    <div class="media-title">
      <span>📸 Photos & Videos</span>
      <div style="display:flex;gap:8px;align-items:center">
        <a id="driveFolderLink" style="font-size:12px;color:var(--gold);text-decoration:none;font-weight:600;display:none" target="_blank">📁 Open in Drive</a>
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">＋ Add</button>
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-bottom:8px">Photos stored full-resolution in Google Drive. Tap ☆ Cover on any photo to show it in the summary.</p>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    <div id="mediaGrid" class="media-grid"><div class="media-empty">Loading…</div></div>`;
  el.appendChild(mediaDiv);

  // Load and show Drive folder link
  getDriveFolderUrl(base.full).then(url=>{
    const link=document.getElementById("driveFolderLink");
    if(link&&url){link.href=url;link.style.display="inline";}
  });

  document.getElementById("fileInput").onchange=async function(){
    const files=Array.from(this.files);if(!files.length)return;
    document.getElementById("mediaGrid").innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:12px;font-size:12px;color:var(--gold)">Uploading…</div>`;
    for(const file of files){
      try{
        showStatus("Uploading "+file.name+"…","var(--gold)",true);
        await uploadFile(base.full,file);
        showStatus("✓ Uploaded — visible in Drive","var(--green)");
      }catch(e){showStatus("⚠ Upload failed: "+e.message,"var(--red)",true);}
    }
    renderMediaGrid(base.full,dd);this.value="";
  };
  renderMediaGrid(base.full,dd);

  // Score + Status
  const sc=calcOverall(dd),pct=sc?parseFloat(sc)/5*100:0;
  const rated=Object.values(dd.ratings).filter(r=>r>0).length;
  const box=document.createElement("div");box.className="dark-box";
  box.innerHTML=`
    <h3>Overall impression</h3>
    <textarea id="overallNote" placeholder="General notes…">${dd.overall||""}</textarea>
    <h3 style="margin-top:16px">Score</h3>
    <div class="score-grid">
      <div><div class="score-lbl">Overall</div><div class="score-val">${sc?sc+"/5":"—"}</div></div>
      <div><div class="score-lbl">Criteria rated</div><div class="score-val">${rated}</div></div>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <h3 style="margin-bottom:12px">Status</h3>
    <div class="status-togs">
      <button class="stog shortlist${dd.status==="shortlist"?" on":""}" onclick="setStatus('shortlist')">⭐ Short list</button>
      <button class="stog ok${dd.status==="ok"?" on":""}" onclick="setStatus('ok')">👍 OK</button>
      <button class="stog discard${dd.status==="discard"?" on":""}" onclick="setStatus('discard')">✗ Discard</button>
    </div>`;
  el.appendChild(box);
  document.getElementById("overallNote").oninput=function(){dd.overall=this.value;save();};
}

function setStatus(val){
  const dd=D[activeId];if(!dd)return;
  dd.status=dd.status===val?"":val;
  save();renderContent();
}

// ── Inline edit for info card fields ─────────────────────────────────────────
function startEditField(key,valEl,dd,base,pageEl){
  const current=dd.overrides?.[key]!==undefined?dd.overrides[key]:base[key];
  const inp=document.createElement("input");
  inp.className="iv-edit";
  inp.value=String(current);
  inp.type=(key==="rent"||key==="sqft"||key==="beds"||key==="units")?"number":"text";
  valEl.replaceWith(inp);
  inp.focus();inp.select();
  function commit(){
    if(!dd.overrides)dd.overrides={};
    dd.overrides[key]=inp.type==="number"?Number(inp.value):inp.value;
    save();renderContent();
  }
  inp.onblur=commit;
  inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.onblur=null;renderContent();}};
}

// ── Media grid with cover photo selection ─────────────────────────────────────
async function renderMediaGrid(aptName,dd){
  const grid=document.getElementById("mediaGrid");if(!grid)return;
  const files=await loadMedia(aptName);
  if(!files.length){grid.innerHTML=`<div class="media-empty" style="grid-column:1/-1">No photos yet — tap + Add to upload</div>`;return;}
  grid.innerHTML="";
  files.forEach(f=>{
    const div=document.createElement("div");div.className="media-thumb";
    const isCover=dd&&dd.coverPhotoId===f.id;
    if(f.mimeType&&f.mimeType.startsWith("image/")){
      div.innerHTML=`<img src="${f.thumb||f.url}" loading="lazy" onclick="window.open('${f.url}','_blank')">`;
      div.innerHTML+=`<button class="cover-btn${isCover?" active":""}" onclick="setCover('${f.id}',this,'${f.thumb||f.url}')">${isCover?"★ Cover":"☆ Cover"}</button>`;
    }else{
      div.innerHTML=`<div style="width:100%;height:100%;background:#222;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="window.open('${f.url}','_blank')"><span style="font-size:32px">🎬</span></div><span class="video-badge">VIDEO</span>`;
    }
    div.innerHTML+=`<button class="del-btn" onclick="deleteMedia('${f.id}','${aptName}')">×</button>`;
    grid.appendChild(div);
  });
}

function setCover(fileId, btn, thumbUrl) {
  const dd=D[activeId];if(!dd)return;
  if(dd.coverPhotoId===fileId){
    dd.coverPhotoId="";dd.coverThumb="";
  } else {
    dd.coverPhotoId=fileId;
    // Compress thumb for summary card — fetch image and resize to 120px
    if(thumbUrl){
      const img=new Image();img.crossOrigin="anonymous";
      img.onload=function(){
        const MAX=120;
        let w=img.width,h=img.height;
        if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        dd.coverThumb=canvas.toDataURL("image/jpeg",0.7);
        save();
      };
      img.onerror=()=>{dd.coverThumb="";save();};
      img.src=thumbUrl;
    }
  }
  save();renderContent();
}

async function deleteMedia(fileId,aptName){
  if(!confirm("Delete this photo/video?"))return;
  const dd=D[activeId];
  if(dd&&dd.coverPhotoId===fileId)dd.coverPhotoId="";
  try{await apiPost({action:"delete",fileId});showStatus("Deleted","var(--green)");renderMediaGrid(aptName,dd);}
  catch(e){showStatus("⚠ Delete failed","var(--red)",true);}
}

function mkStars(val,onChange){
  const div=document.createElement("div");div.className="stars";
  for(let s=1;s<=5;s++){
    const sp=document.createElement("span");sp.className="star"+(val>=s?" on":"");sp.textContent="★";
    const sv=s;sp.onclick=()=>onChange(val===sv?0:sv);div.appendChild(sp);
  }return div;
}
function mkTxt(val,onChange,ph="Notes..."){
  const ta=document.createElement("textarea");ta.value=val||"";ta.placeholder=ph;
  ta.oninput=function(){onChange(this.value);};return ta;
}
function mkTogs(opts,val,onChange){
  const div=document.createElement("div");div.className="togs";
  opts.forEach(o=>{
    const b=document.createElement("button");b.className="tog"+(val===o?" on":"");b.textContent=o;
    b.onclick=()=>onChange(val===o?null:o);div.appendChild(b);
  });return div;
}
function catScore(dd,ci){
  let t=0,n=0;
  CATS[ci].cr.forEach((cr,ri)=>{if(cr.t)return;const r=dd.ratings[ci+"-"+ri];if(r){t+=r;n++;}});
  return n?(t/n).toFixed(1):null;
}
function calcOverall(dd){
  let t=0,n=0;CATS.forEach((_,ci)=>{const s=catScore(dd,ci);if(s){t+=parseFloat(s);n++;}});
  return n?(t/n).toFixed(1):null;
}

initApp();
